<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BULOK AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px;
      background: #191e2b;
      border-bottom: 1px solid #303747;
      text-align: center;
    }
    header h1 { margin: 0; color: #62e6c5; }
    header p { margin: 6px 0 0; color: #aab3c5; font-size: 13px; }
    main {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #chat {
      flex: 1;
      min-height: 350px;
      overflow-y: auto;
      padding: 12px 0;
    }
    .message {
      padding: 13px 16px;
      margin: 10px 0;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #245c55; margin-left: 35px; }
    .ai { background: #202838; margin-right: 35px; }
    .input-area { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #414b60;
      background: #202838;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: #62e6c5;
      color: #10131c;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    footer {
      text-align: center;
      color: #8993a7;
      padding: 15px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>BULOK AI</h1>
    <p>Created by Rehan</p>
  </header>

  <main>
    <div id="chat">
      <div class="message ai">
        Halo! Saya BULOK AI. Ada yang bisa saya bantu hari ini?
      </div>
    </div>

    <form id="form" class="input-area">
      <input id="message" placeholder="Tulis pesan untuk BULOK AI..." autocomplete="off" required>
      <button id="send" type="submit">Kirim</button>
    </form>
  </main>

  <footer>BULOK AI © 2026 — Created by Rehan</footer>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;

      const loading = addMessage("BULOK AI sedang berpikir...", "ai");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Terjadi kesalahan.");

        loading.textContent = data.reply || "Belum ada jawaban.";
      } catch (error) {
        loading.textContent = "Maaf, terjadi masalah: " + error.message;
      } finally {
        send.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    });
  </script>
</body>
  </html>
